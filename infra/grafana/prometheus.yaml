global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_native_histograms: true

scrape_configs:
  - job_name: "payments-api"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8181"]
        labels:
          application: "payments-api"
