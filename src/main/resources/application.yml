# Profile default — usado quando nenhum profile ativo.
# Configurações comuns compartilhadas por local/test/prod.

spring:
  application:
    name: payments-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payments}
    username: ${POSTGRES_USER:payments}
    password: ${POSTGRES_PASSWORD:payments}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: payments-pool
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5
        batch.size: 32768
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8080/realms/payments}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/payments/protocol/openid-connect/certs}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  outbox:
    publisher: ${OUTBOX_PUBLISHER:kafka}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:2000}
  ingress:
    publisher: ${INGRESS_PUBLISHER:kafka}
    consumer:
      enabled: ${INGRESS_CONSUMER_ENABLED:true}
  kafka:
    topics:
      ingress: ${KAFKA_TOPIC_INGRESS:payments.ingress}
    ingress-concurrency: ${KAFKA_INGRESS_CONCURRENCY:10}
    ingress-group: ${KAFKA_INGRESS_GROUP:payments-ingress-workers}

server:
  port: 8181
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      outboxPublisher:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
      redisIdempotency:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-},spanId=%X{spanId:-}] - %msg%n"
  level:
    com.portfolio.payments: INFO
    org.hibernate.SQL: WARN
