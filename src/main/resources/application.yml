spring:
  application:
    name: payments-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payments_api}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        pool-name: payments-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

server:
  port: 8181
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      outboxPublisher:
        baseConfig: default
        # publisher de eventos: queremos ser mais sensíveis — 5 falhas em 10 calls já abre
        slidingWindowSize: 10
        failureRateThreshold: 50
        # em half-open, só 3 calls de prova antes de fechar de novo
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-},spanId=%X{spanId:-}] - %msg%n"
  level:
    com.portfolio.payments: INFO
    org.hibernate.SQL: WARN